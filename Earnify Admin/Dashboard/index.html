<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Earnify Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      border-right: 2px solid rgba(102,126,234,0.15);
      padding: 30px 0;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-brand {
      padding: 0 28px 24px;
      border-bottom: 2px solid rgba(102,126,234,0.12);
      margin-bottom: 12px;
    }

    .sidebar-brand h2 {
      font-size: 21px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .sidebar-brand h2 .brand-text {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sidebar-brand p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
      font-weight: 500;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #64748b;
      padding: 12px 28px;
      text-decoration: none;
      border-left: 3px solid transparent;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.22s;
    }

    .nav-link:hover {
      background: rgba(102,126,234,0.07);
      border-left-color: #667eea;
      color: #667eea;
      padding-left: 34px;
    }

    .nav-link.active {
      background: linear-gradient(90deg, rgba(102,126,234,0.13), rgba(102,126,234,0.06));
      border-left-color: #667eea;
      color: #667eea;
      font-weight: 700;
    }

    .nav-icon { font-size: 17px; width: 22px; text-align: center; }

    .sidebar-footer {
      margin-top: auto;
      padding: 18px 20px;
      border-top: 1px solid #e2e8f0;
    }

    .admin-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08));
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .admin-avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: white; font-weight: 700; flex-shrink: 0;
    }

    .admin-info { flex: 1; overflow: hidden; }
    .admin-name { font-size: 13px; font-weight: 700; color: #1e293b; }
    .admin-role { font-size: 10px; color: #94a3b8; font-weight: 500; }

    .logout-btn {
      width: 100%;
      padding: 9px;
      background: white;
      color: #dc2626;
      border: 1.5px solid #ef4444;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .logout-btn:hover { background: #fee2e2; }

    /* ── Overlay ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 99;
    }
    .overlay.active { display: block; }

    /* ── Mobile toggle ── */
    .mobile-toggle {
      display: none;
      position: fixed;
      top: 14px; left: 14px;
      z-index: 200;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
    }

    .mobile-toggle span {
      width: 22px; height: 2px;
      background: #fff;
      border-radius: 2px;
      display: block;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 32px 36px;
      overflow-y: auto;
      min-height: 100vh;
    }

    /* ── Page Header ── */
    .page-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 28px 32px;
      border-radius: 18px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .page-header h1 { color: #fff; font-size: 26px; font-weight: 800; margin-bottom: 4px; }
    .page-header p  { color: rgba(255,255,255,0.82); font-size: 14px; }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .live-dot {
      width: 7px; height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(1.3); }
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .refresh-btn:hover { background: rgba(255,255,255,0.28); }

    /* ── Stat Cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: auto auto;
      gap: 16px;
      margin-bottom: 30px;
    }

    /* Available Balance spans full width on its own row */
    .stat-card:nth-child(1) {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      box-shadow: 0 8px 32px rgba(102,126,234,0.30);
      position: relative;
      overflow: hidden;
      transition: transform 0.22s, box-shadow 0.22s;
      cursor: default;
    }
    .stat-card:nth-child(1)::after {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }
    .stat-card:nth-child(1):hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(102,126,234,0.40); }
    .stat-card:nth-child(1) .stat-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: rgba(255,255,255,0.20);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; flex-shrink: 0;
    }
    .stat-card:nth-child(1) .stat-label { font-size: 12px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
    .stat-card:nth-child(1) .stat-value { font-size: 42px; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 6px; letter-spacing: -1px; }
    .stat-card:nth-child(1) .stat-sub   { font-size: 13px; color: rgba(255,255,255,0.65); font-weight: 500; }

    /* Bottom 4 cards */
    .stat-card:nth-child(n+2) {
      background: #fff;
      border-radius: 18px;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(0,0,0,0.06);
      position: relative;
      overflow: hidden;
      transition: transform 0.22s, box-shadow 0.22s;
      cursor: default;
    }
    .stat-card:nth-child(n+2):hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.09); }

    /* Colored left accent bar */
    .stat-card:nth-child(n+2)::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 18px 0 0 18px;
    }
    .stat-card:nth-child(2)::before { background: linear-gradient(180deg, #f093fb, #f5576c); }
    .stat-card:nth-child(3)::before { background: linear-gradient(180deg, #ff6b6b, #ee5a24); }
    .stat-card:nth-child(4)::before { background: linear-gradient(180deg, #11998e, #38ef7d); }
    .stat-card:nth-child(5)::before { background: linear-gradient(180deg, #f9ca24, #f0932b); }

    .stat-card:nth-child(n+2) .stat-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      transition: transform 0.2s;
    }
    .stat-card:nth-child(n+2):hover .stat-icon { transform: scale(1.1); }
    .stat-card:nth-child(2) .stat-icon { background: linear-gradient(135deg, rgba(240,147,251,0.15), rgba(245,87,108,0.15)); }
    .stat-card:nth-child(3) .stat-icon { background: linear-gradient(135deg, rgba(255,107,107,0.15), rgba(238,90,36,0.15)); }
    .stat-card:nth-child(4) .stat-icon { background: linear-gradient(135deg, rgba(17,153,142,0.15), rgba(56,239,125,0.15)); }
    .stat-card:nth-child(5) .stat-icon { background: linear-gradient(135deg, rgba(249,202,36,0.15), rgba(240,147,43,0.15)); }

    .stat-card:nth-child(n+2) .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.7px; font-weight: 700; margin-bottom: 5px; }
    .stat-card:nth-child(n+2) .stat-value { font-size: 26px; font-weight: 900; color: #1e293b; line-height: 1; margin-bottom: 4px; transition: color 0.2s; }
    .stat-card:nth-child(2):hover .stat-value { color: #f5576c; }
    .stat-card:nth-child(3):hover .stat-value { color: #ee5a24; }
    .stat-card:nth-child(4):hover .stat-value { color: #11998e; }
    .stat-card:nth-child(5):hover .stat-value { color: #f0932b; }
    .stat-card:nth-child(n+2) .stat-sub { font-size: 11px; color: #64748b; font-weight: 500; }

    .stat-body { flex: 1; position: relative; z-index: 1; }

    /* ── Shimmer ── */
    .shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400% 100%;
      animation: shimmer-slide 1.4s infinite linear;
      border-radius: 6px;
    }

    @keyframes shimmer-slide {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .shimmer-value { width: 80px; height: 28px; margin-bottom: 6px; }
    .shimmer-sub   { width: 100px; height: 11px; }

    .stat-card.is-shimmer .stat-icon { background-image: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%) !important; background-size: 400% 100% !important; animation: shimmer-slide 1.4s infinite linear !important; }
    .stat-card.is-shimmer .stat-icon span { visibility: hidden; }
    .stat-card:nth-child(1).is-shimmer { background: #e2e8f0 !important; box-shadow: none !important; }
    .stat-card:nth-child(1).is-shimmer::after { display: none; }

    /* ── Recent Purchases Table ── */
    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .table-card {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 28px;
    }

    .table-card > div { overflow-x: auto; }

    .table-header {
      padding: 18px 22px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .table-header h3 { font-size: 15px; font-weight: 700; color: #1e293b; }
    .table-header span { font-size: 12px; color: #94a3b8; font-weight: 500; }

    table { width: 100%; border-collapse: collapse; }

    thead { background: linear-gradient(135deg, #667eea, #764ba2); }

    th {
      padding: 13px 18px;
      text-align: left;
      color: white;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 13px 18px;
      border-bottom: 1px solid #f8fafc;
      font-size: 13px;
      color: #475569;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-completed { background: #d1fae5; color: #065f46; }
    .badge-pending   { background: #fef3c7; color: #92400e; }
    .badge-failed    { background: #fee2e2; color: #991b1b; }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #94a3b8;
    }

    .empty-state .empty-icon { font-size: 44px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; }

/* ── Error Banner ── */
    .error-banner {
      display: none;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      color: #991b1b;
      font-size: 13px;
      font-weight: 500;
    }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .stat-card:nth-child(1) { grid-column: 1 / -1; }
    }

    @media (max-width: 768px) {
      .mobile-toggle { display: flex; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.active { transform: translateX(0); }
      .main { margin-left: 0; padding: 20px 16px; padding-top: 64px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .stat-card:nth-child(1) { grid-column: 1 / -1; }
      .stat-card:nth-child(1) .stat-value { font-size: 32px; }
      .page-header { padding: 20px 20px; }
      .page-header h1 { font-size: 20px; }
      th, td { padding: 10px 12px; font-size: 12px; }
    }

    @media (max-width: 480px) {
      .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card:nth-child(1) { grid-column: 1 / -1; padding: 20px 18px; }
      .stat-card:nth-child(1) .stat-value { font-size: 28px; }
      .stat-card:nth-child(n+2) { padding: 16px 14px; }
      .stat-card:nth-child(n+2) .stat-value { font-size: 20px; }
      .header-meta { display: none; }
    }
  </style>
</head>
<body>

<button class="mobile-toggle" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h2><span>💰</span><span class="brand-text">Earnify Admin</span></h2>
    <p>Platform Management</p>
  </div>

  <a href="/earnify-admin/Dashboard/" class="nav-link active">
    <span class="nav-icon">🏠</span> Dashboard
  </a>
  <a href="/earnify-admin/statistic/" class="nav-link">
    <span class="nav-icon">📈</span> Statistics
  </a>

  <div class="sidebar-footer">
    <div class="admin-badge">
      <div class="admin-avatar" id="adminAvatar">A</div>
      <div class="admin-info">
        <div class="admin-name" id="adminName">Admin</div>
        <div class="admin-role">Super Admin</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>🏠 Dashboard</h1>
      <p>Live overview of your Earnify platform</p>
    </div>
    <div class="header-meta">
      <div class="live-badge">
        <div class="live-dot"></div>
        Live Data
      </div>
      <button class="refresh-btn" onclick="loadDashboard()">🔄 Refresh</button>
    </div>
  </div>




  <!-- Stat Cards -->
  <div class="stat-grid" id="statGrid">
    <div class="stat-card is-shimmer">
      <div class="stat-icon"><span>🏦</span></div>
      <div class="stat-body">
        <div class="stat-label">Available Balance</div>
        <div class="shimmer shimmer-value" id="cardAvailable"></div>
        <div class="shimmer shimmer-sub"></div>
      </div>
    </div>
    <div class="stat-card is-shimmer">
      <div class="stat-icon"><span>💰</span></div>
      <div class="stat-body">
        <div class="stat-label">Total Earned</div>
        <div class="shimmer shimmer-value" id="cardRevenue"></div>
        <div class="shimmer shimmer-sub" id="cardRevenueSub"></div>
      </div>
    </div>
    <div class="stat-card is-shimmer">
      <div class="stat-icon"><span>💸</span></div>
      <div class="stat-body">
        <div class="stat-label">Withdrawn</div>
        <div class="shimmer shimmer-value" id="cardWithdrawn"></div>
        <div class="shimmer shimmer-sub" id="cardWithdrawnSub"></div>
      </div>
    </div>
    <div class="stat-card is-shimmer">
      <div class="stat-icon"><span>🏦</span></div>
      <div class="stat-body">
        <div class="stat-label">Platform Fees</div>
        <div class="shimmer shimmer-value" id="cardFees"></div>
        <div class="shimmer shimmer-sub"></div>
      </div>
    </div>
    <div class="stat-card is-shimmer">
      <div class="stat-icon"><span>⏳</span></div>
      <div class="stat-body">
        <div class="stat-label">Pending</div>
        <div class="shimmer shimmer-value" id="cardPending"></div>
        <div class="shimmer shimmer-sub"></div>
      </div>
    </div>
  </div>

</div><!-- /main -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="dashboard.js"></script>
</body>
</html>
