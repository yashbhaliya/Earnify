<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics - Earnify Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      border-right: 2px solid rgba(102,126,234,0.15);
      padding: 30px 0;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.3s ease;
    }

    .sidebar-brand {
      padding: 0 28px 24px;
      border-bottom: 2px solid rgba(102,126,234,0.12);
      margin-bottom: 12px;
    }

    .sidebar-brand h2 {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 21px;
      font-weight: 800;
    }

    .sidebar-brand p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 3px;
      font-weight: 500;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 11px;
      color: #64748b;
      padding: 12px 28px;
      text-decoration: none;
      border-left: 3px solid transparent;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.22s;
    }

    .nav-link:hover {
      background: rgba(102,126,234,0.07);
      border-left-color: #667eea;
      color: #667eea;
      padding-left: 34px;
    }

    .nav-link.active {
      background: linear-gradient(90deg, rgba(102,126,234,0.13), rgba(102,126,234,0.06));
      border-left-color: #667eea;
      color: #667eea;
      font-weight: 700;
    }

    .nav-icon { font-size: 17px; width: 22px; text-align: center; }

    .sidebar-footer {
      margin-top: auto;
      padding: 18px 20px;
      border-top: 1px solid #e2e8f0;
    }

    .admin-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.08));
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .admin-avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: white; font-weight: 700; flex-shrink: 0;
    }

    .admin-info { flex: 1; overflow: hidden; }
    .admin-name { font-size: 13px; font-weight: 700; color: #1e293b; }
    .admin-role { font-size: 10px; color: #94a3b8; font-weight: 500; }

    .logout-btn {
      width: 100%;
      padding: 9px;
      background: white;
      color: #dc2626;
      border: 1.5px solid #ef4444;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .logout-btn:hover { background: #fee2e2; }

    /* ── Overlay ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 99;
    }
    .overlay.active { display: block; }

    /* ── Mobile toggle ── */
    .mobile-toggle {
      display: none;
      position: fixed;
      top: 14px; left: 14px;
      z-index: 200;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
    }

    .mobile-toggle span {
      width: 22px; height: 2px;
      background: #fff;
      border-radius: 2px;
      display: block;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 32px 36px;
      overflow-y: auto;
      min-height: 100vh;
    }

    /* ── Page Header ── */
    .page-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 28px 32px;
      border-radius: 18px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .page-header h1 { color: #fff; font-size: 26px; font-weight: 800; margin-bottom: 4px; }
    .page-header p  { color: rgba(255,255,255,0.82); font-size: 14px; }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.35);
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .refresh-btn:hover { background: rgba(255,255,255,0.28); }

    /* ── Stat Cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
      transition: transform 0.22s, box-shadow 0.22s;
      cursor: default;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      transition: height 0.2s;
    }

    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.09); }
    .stat-card:hover::before { height: 4px; }

    .stat-card:nth-child(1)::before { background: linear-gradient(90deg, #667eea, #764ba2); }
    .stat-card:nth-child(2)::before { background: linear-gradient(90deg, #f093fb, #f5576c); }
    .stat-card:nth-child(3)::before { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }
    .stat-card:nth-child(4)::before { background: linear-gradient(90deg, #f9ca24, #f0932b); }

    .stat-icon {
      width: 54px; height: 54px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .stat-card:hover .stat-icon { transform: scale(1.08); }

    .stat-card:nth-child(1) .stat-icon { background: linear-gradient(135deg, #667eea, #764ba2); }
    .stat-card:nth-child(2) .stat-icon { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .stat-card:nth-child(3) .stat-icon { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
    .stat-card:nth-child(4) .stat-icon { background: linear-gradient(135deg, #f9ca24, #f0932b); }

    .stat-body { flex: 1; }

    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: 900;
      color: #1e293b;
      line-height: 1;
      margin-bottom: 5px;
      transition: color 0.2s;
    }

    .stat-card:hover .stat-value { color: #667eea; }

    .stat-sub {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    /* ── Shimmer ── */
    .shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
      background-size: 400% 100%;
      animation: shimmer-slide 1.4s infinite linear;
      border-radius: 6px;
    }

    @keyframes shimmer-slide {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .shimmer-value { width: 80px; height: 28px; margin-bottom: 6px; }
    .shimmer-sub   { width: 100px; height: 11px; }

    /* ── Table Card ── */
    .table-card {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.05);
      overflow: hidden;
      margin-bottom: 28px;
    }

    .table-card > div { overflow-x: auto; }

    .table-header {
      padding: 24px 28px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .table-header h3 { font-size: 17px; font-weight: 700; color: #1e293b; }

    .table-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 13px;
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      width: 150px;
      color: #1e293b;
      font-family: inherit;
    }

    .search-box input::placeholder { color: #94a3b8; }

    .filter-btn {
      padding: 8px 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      color: #64748b;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn:hover { border-color: #667eea; color: #667eea; }

    .record-count {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
    }

    table { width: 100%; border-collapse: collapse; min-width: 600px; }

    thead { background: linear-gradient(135deg, #667eea, #764ba2); }

    th {
      padding: 14px 18px;
      text-align: left;
      color: white;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 18px;
      border-bottom: 1px solid #f8fafc;
      font-size: 13px;
      color: #475569;
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbff; }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-completed { background: #d1fae5; color: #065f46; }
    .badge-pending   { background: #fef3c7; color: #92400e; }
    .badge-failed    { background: #fee2e2; color: #991b1b; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .mobile-toggle { display: flex; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.active { transform: translateX(0); }
      .main { margin-left: 0; padding: 20px 16px; padding-top: 64px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .stat-value { font-size: 24px; }
      .stat-icon { width: 44px; height: 44px; font-size: 20px; }
      .page-header { padding: 20px 20px; }
      .page-header h1 { font-size: 20px; }
      .table-header { padding: 16px 14px; }
      .table-controls { width: 100%; }
      .search-box input { width: 100px; }
      th, td { padding: 10px 12px; font-size: 12px; }
    }

    @media (max-width: 480px) {
      .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card { padding: 16px 14px; gap: 12px; }
      .stat-value { font-size: 22px; }
      .table-header { flex-direction: column; align-items: flex-start; }
      .table-controls { width: 100%; }
      .search-box { width: 100%; }
      .search-box input { width: 100%; }
    }
  </style>
</head>
<body>

<button class="mobile-toggle" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h2>💰 Earnify Admin</h2>
    <p>Platform Management</p>
  </div>

  <a href="../Dashboard/" class="nav-link">
    <span class="nav-icon">🏠</span> Dashboard
  </a>
  <a href="./" class="nav-link active">
    <span class="nav-icon">📈</span> Statistics
  </a>

  <div class="sidebar-footer">
    <div class="admin-badge">
      <div class="admin-avatar" id="adminAvatar">A</div>
      <div class="admin-info">
        <div class="admin-name" id="adminName">Admin</div>
        <div class="admin-role">Super Admin</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Header -->
  <div class="page-header">
    <div>
      <h1>📊 Statistics</h1>
      <p>Detailed analytics and recent purchases</p>
    </div>
    <div class="header-meta">
      <button class="refresh-btn" onclick="loadStats()">🔄 Refresh</button>
    </div>
  </div>

  <!-- 4 Stat Cards -->
  <div class="stat-grid">

    <!-- 1. Total Revenue -->
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-body">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value" id="valRevenue">
          <div class="shimmer shimmer-value"></div>
        </div>
        <div class="stat-sub" id="subRevenue">
          <div class="shimmer shimmer-sub"></div>
        </div>
      </div>
    </div>

    <!-- 2. Total Purchases -->
    <div class="stat-card">
      <div class="stat-icon">🛒</div>
      <div class="stat-body">
        <div class="stat-label">Total Purchases</div>
        <div class="stat-value" id="valPurchases">
          <div class="shimmer shimmer-value"></div>
        </div>
        <div class="stat-sub" id="subPurchases">
          <div class="shimmer shimmer-sub"></div>
        </div>
      </div>
    </div>

    <!-- 3. Avg Order Value -->
    <div class="stat-card">
      <div class="stat-icon">📊</div>
      <div class="stat-body">
        <div class="stat-label">Avg Order Value</div>
        <div class="stat-value" id="valAvgOrder">
          <div class="shimmer shimmer-value"></div>
        </div>
        <div class="stat-sub" id="subAvgOrder">
          <div class="shimmer shimmer-sub"></div>
        </div>
      </div>
    </div>

    <!-- 4. Unique Buyers -->
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-body">
        <div class="stat-label">Unique Buyers</div>
        <div class="stat-value" id="valBuyers">
          <div class="shimmer shimmer-value"></div>
        </div>
        <div class="stat-sub" id="subBuyers">
          <div class="shimmer shimmer-sub"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Recent Purchases Table -->
  <div class="table-card">
    <div class="table-header">
      <h3>🛒 Recent Purchases</h3>
      <div class="table-controls">
        <div class="search-box">
          <span>🔍</span>
          <input type="text" id="searchInput" placeholder="Search email or resource..." oninput="filterTable()">
        </div>
        <select id="statusFilter" class="filter-btn" onchange="filterTable()">
          <option value="">All Status</option>
          <option value="completed">✅ Completed</option>
          <option value="pending">⏳ Pending</option>
          <option value="failed">❌ Failed</option>
        </select>
        <span class="record-count" id="recordCount">Loading...</span>
      </div>
    </div>
    <div>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Buyer Email</th>
            <th>Resource</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="purchaseTbody">
          <tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⏳</div><p>Loading...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? 'http://127.0.0.1:5000' : location.origin;

  console.log('[Statistics] API_BASE =>', API_BASE);

  async function apiFetch(path) {
    const url = API_BASE + path;
    console.log('[apiFetch] GET', url);
    const res = await fetch(url);
    console.log('[apiFetch] status', res.status, path);
    if (!res.ok) throw new Error(`HTTP ${res.status} — ${path}`);
    const data = await res.json();
    console.log('[apiFetch] data', path, data);
    return data;
  }

  // ── Auth sidebar ──
  (function() {
    const token = localStorage.getItem('adminToken');
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        const name = payload.email?.split('@')[0] || 'Admin';
        document.getElementById('adminName').textContent = name;
        document.getElementById('adminAvatar').textContent = name.charAt(0).toUpperCase();
      } catch(e) { console.warn('[Statistics] token decode failed', e); }
    }
  })();

  function logout() {
    localStorage.clear(); sessionStorage.clear();
    location.href = '../../public/admin/login.html';
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
  }

  function setCard(id, subId, value, sub) {
    document.getElementById(id).textContent = value;
    document.getElementById(subId).textContent = sub;
  }

  function fmt(n) { return '₹' + Math.round(n || 0).toLocaleString('en-IN'); }

  function fmtDate(d) {
    return d ? new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—';
  }

  let allPurchases = [];

  async function loadStats() {
    console.log('[Statistics] loadStats() called');
    ['valRevenue','valPurchases','valAvgOrder','valBuyers'].forEach(id =>
      document.getElementById(id).innerHTML = '<div class="shimmer shimmer-value"></div>');
    ['subRevenue','subPurchases','subAvgOrder','subBuyers'].forEach(id =>
      document.getElementById(id).innerHTML = '<div class="shimmer shimmer-sub"></div>');

    try {
      // /api/admin/purchases already joins buyer email + resource info server-side
      allPurchases = await apiFetch('/api/admin/purchases');
      console.log('[Statistics] allPurchases =>', allPurchases.length, allPurchases);

      const completed    = allPurchases.filter(p => p.status === 'completed');
      const totalRevenue = completed.reduce((s, p) => s + parseFloat(p.amount || p.resource_price || 0), 0);
      const uniqueBuyers = new Set(allPurchases.map(p => p.buyer_email)).size;
      const avgOrder     = completed.length ? totalRevenue / completed.length : 0;

      console.log('[Statistics] computed =>', { totalRevenue, uniqueBuyers, avgOrder, completed: completed.length });

      setCard('valRevenue',   'subRevenue',   fmt(totalRevenue),      `From ${completed.length} sales`);
      setCard('valPurchases', 'subPurchases', allPurchases.length,    `${completed.length} completed`);
      setCard('valAvgOrder',  'subAvgOrder',  fmt(avgOrder),          'Per transaction');
      setCard('valBuyers',    'subBuyers',    uniqueBuyers,           'Unique customers');

      renderTable(allPurchases);

    } catch (err) {
      console.error('[Statistics] loadStats error =>', err);
      const subIds = ['subRevenue','subPurchases','subAvgOrder','subBuyers'];
      ['valRevenue','valPurchases','valAvgOrder','valBuyers'].forEach((id, i) =>
        setCard(id, subIds[i], '—', 'Error loading'));
      document.getElementById('purchaseTbody').innerHTML =
        `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">⚠️</div><p>${err.message}<br><small>Is the server running at ${API_BASE}?</small></p></div></td></tr>`;
      document.getElementById('recordCount').textContent = 'Error';
    }
  }

  function renderTable(rows) {
    const tbody = document.getElementById('purchaseTbody');
    document.getElementById('recordCount').textContent = `${rows.length} records`;

    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">📭</div><p>No purchase records found.</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((p, i) => {
      const status   = p.status || 'completed';
      const amount   = parseFloat(p.amount || p.resource_price || 0);
      const badgeCls = status === 'completed' ? 'badge-completed' : status === 'pending' ? 'badge-pending' : 'badge-failed';
      return `<tr>
        <td style="color:#94a3b8;font-weight:600;">${i + 1}</td>
        <td style="font-weight:500;color:#1e293b;">${p.buyer_email || '—'}</td>
        <td>${p.resource_title || '—'}</td>
        <td style="font-weight:700;color:#10b981;">${fmt(amount)}</td>
        <td><span class="badge ${badgeCls}">${status}</span></td>
        <td>${fmtDate(p.created_at)}</td>
      </tr>`;
    }).join('');
  }

  function filterTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    const filtered = allPurchases.filter(p => {
      const matchSearch = !search ||
        (p.buyer_email || '').toLowerCase().includes(search) ||
        (p.resource_title || '').toLowerCase().includes(search);
      const matchStatus = !status || p.status === status;
      return matchSearch && matchStatus;
    });
    console.log('[Statistics] filterTable =>', filtered.length, 'rows');
    renderTable(filtered);
  }

  loadStats();
</script>
</body>
</html>
