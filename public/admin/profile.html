<!DOCTYPE html>
<html>
<head>
  <title>Profile - Earnify Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="light-theme.css">
  <style>
    .profile-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .profile-header {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
    }
    .profile-avatar-large {
      width: 100px;
      height: 100px;
      background: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }
    .profile-name {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .profile-email {
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
    }
    .profile-details {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .profile-details h2 {
      color: #10b981;
      margin-bottom: 25px;
      font-size: 22px;
      border-bottom: 2px solid #334155;
      padding-bottom: 15px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid #334155;
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .detail-label {
      color: #000000;
      font-weight: 600;
    }
    .detail-value {
      color: #000000;
      font-weight: 500;
    }
    .edit-profile-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }
    .edit-profile-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body class="light-mode">

<div class="sidebar">
  <h2>Earnify Admin</h2>
  <a href="resources.html">📚 Resources</a>
  <a href="analytics.html">📈 Statistics</a>
  <a href="profile.html" style=" border-left-color: #60a5fa; color: #60a5fa;">👤 Profile</a>
  <a href="../index.html" style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 10px;">🏠 Main Site</a>
            <a onclick="logout()"><span>🚪</span> Logout</a>
  
  <!-- User Profile Section -->
  <div class="sidebar-user" id="sidebarUser" style="display: none;">
    <div class="user-info">
      <div class="user-avatar" id="sidebarAvatar">👤</div>
      <div class="user-details">
        <div class="user-name" id="sidebarUserName">User</div>
        <div class="user-email" id="sidebarUserEmail">user@email.com</div>
      </div>
    </div>
    <a onclick="logout()" class="logout-link">🚪 Logout</a>
  </div>
</div>

<div class="main">
  <div class="profile-container">
    <div class="profile-header">
      <div class="profile-avatar-large" id="profileAvatarLarge">👤</div>
      <div class="profile-name" id="profileName">User Name</div>
      <div class="profile-email" id="profileEmail">user@email.com</div>
    </div>

    <div class="profile-details">
      <h2>Profile Information</h2>
      <div class="detail-row">
        <span class="detail-label">Full Name:</span>
        <span class="detail-value" id="detailName">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Email:</span>
        <span class="detail-value" id="detailEmail">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">User ID:</span>
        <span class="detail-value" id="detailUserId">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Account Created:</span>
        <span class="detail-value" id="detailCreated">-</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Last Login:</span>
        <span class="detail-value" id="detailLastLogin">-</span>
      </div>
      <button class="edit-profile-btn" onclick="editProfile()">✏️ Edit Profile</button>
    </div>
  </div>
</div>

<!-- Edit Profile Modal -->
<div id="editProfileModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeEditProfileModal()">&times;</span>
    <h2 style="color: #60a5fa; text-align: center; margin-bottom: 25px;">Edit Profile</h2>
    <form id="editProfileForm" onsubmit="handleEditProfile(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="editName" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="editEmail" required>
      </div>
      <button type="submit" class="btn-submit">Save Changes</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');

  function loadProfile() {
    if (!currentUser || !currentUser.id) {
      alert('Please login first');
      window.location.href = 'login.html';
      return;
    }

    const userName = currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || 'User';
    const userEmail = currentUser.email || 'No email';
    const userId = currentUser.id || 'N/A';
    const createdAt = currentUser.created_at ? new Date(currentUser.created_at).toLocaleDateString() : 'N/A';
    const lastLogin = currentUser.last_sign_in_at ? new Date(currentUser.last_sign_in_at).toLocaleDateString() : 'N/A';

    // Update header
    document.getElementById('profileAvatarLarge').textContent = userName.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent = userName;
    document.getElementById('profileEmail').textContent = userEmail;

    // Update details
    document.getElementById('detailName').textContent = userName;
    document.getElementById('detailEmail').textContent = userEmail;
    document.getElementById('detailUserId').textContent = userId;
    document.getElementById('detailCreated').textContent = createdAt;
    document.getElementById('detailLastLogin').textContent = lastLogin;
  }

  function editProfile() {
    const userName = currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || '';
    const userEmail = currentUser.email || '';

    document.getElementById('editName').value = userName;
    document.getElementById('editEmail').value = userEmail;
    document.getElementById('editProfileModal').style.display = 'flex';
  }

  function closeEditProfileModal() {
    document.getElementById('editProfileModal').style.display = 'none';
  }

  async function handleEditProfile(event) {
    event.preventDefault();
    
    const newName = document.getElementById('editName').value;
    const newEmail = document.getElementById('editEmail').value;

    try {
      // Update user metadata
      const { data, error } = await supabaseClient.auth.updateUser({
        email: newEmail,
        data: { name: newName }
      });

      if (error) throw error;

      // Update localStorage
      currentUser.email = newEmail;
      currentUser.user_metadata = { ...currentUser.user_metadata, name: newName };
      localStorage.setItem('currentUser', JSON.stringify(currentUser));

      alert('Profile updated successfully!');
      closeEditProfileModal();
      loadProfile();
    } catch (error) {
      console.error('Error updating profile:', error);
      alert('Failed to update profile: ' + error.message);
    }
  }

  function logout() {
    localStorage.removeItem('adminToken');
    localStorage.removeItem('currentUser');
    localStorage.removeItem('userLoggedIn');
    window.location.href = '../index.html';
  }

  // Load profile on page load
  window.addEventListener('DOMContentLoaded', function() {
    loadProfile();
    
    // Update sidebar profile
    const token = localStorage.getItem('adminToken');
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
    const sidebarUser = document.getElementById('sidebarUser');
    
    if (token && currentUser.email) {
      if (sidebarUser) sidebarUser.style.display = 'block';
      
      const userName = currentUser.user_metadata?.name || currentUser.email?.split('@')[0] || 'User';
      const userEmail = currentUser.email || '';
      
      const sidebarUserName = document.getElementById('sidebarUserName');
      const sidebarUserEmail = document.getElementById('sidebarUserEmail');
      const sidebarAvatar = document.getElementById('sidebarAvatar');
      
      if (sidebarUserName) sidebarUserName.textContent = userName;
      if (sidebarUserEmail) sidebarUserEmail.textContent = userEmail;
      if (sidebarAvatar) sidebarAvatar.textContent = userName.charAt(0).toUpperCase();
    }
  });

  // Close modal when clicking outside
  window.onclick = function(event) {
    const modal = document.getElementById('editProfileModal');
    if (event.target === modal) {
      closeEditProfileModal();
    }
  }
</script>
</body>
</html>
