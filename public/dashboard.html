<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Earnify</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .nav { background: #8b5cf6; padding: 15px; color: white; margin-bottom: 20px; }
    .nav a { color: white; text-decoration: none; margin-right: 20px; }
    .purchase-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
    .status { padding: 5px 10px; border-radius: 15px; font-size: 12px; }
    .completed { background: #10b981; color: white; }
  </style>
</head>
<body>
  <div class="nav">
    <h2>Earnify Dashboard</h2>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="payment.html">Buy Resources</a>
    <a href="details.html">Details</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

  <h1>My Purchases</h1>
  <div id="purchases"></div>

  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser) {
      alert('Please login first');
      window.location.href = '/';
    }

    async function loadPurchases() {
      try {
        const response = await fetch(`/api/payments/${currentUser.id}`);
        const purchases = await response.json();
        console.log('Loaded purchases:', purchases);
        
        const container = document.getElementById('purchases');
        if (purchases.length === 0) {
          container.innerHTML = `
            <p>No purchases yet. <a href="/#resources">Browse resources</a></p>
            <button onclick="testPayment()">Test Add Payment</button>
          `;
          return;
        }
        
        container.innerHTML = purchases.map(purchase => `
          <div class="purchase-card">
            <h3>${purchase.resources?.title || 'Resource'}</h3>
            <p>Type: ${purchase.resources?.type || 'N/A'}</p>
            <p>Price: ₹${purchase.resources?.price || 'N/A'}</p>
            <p>Payment ID: ${purchase.payment_id}</p>
            <p>Date: ${new Date(purchase.created_at).toLocaleDateString()}</p>
            <span class="status completed">${purchase.status}</span>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading purchases:', error);
        document.getElementById('purchases').innerHTML = '<p>Error loading purchases</p>';
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('userLoggedIn');
      localStorage.removeItem('userPurchases');
      window.location.href = '/';
    }
    
    async function testPayment() {
      try {
        const response = await fetch('/api/test-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        if (result.success) {
          alert('Test payment added!');
          loadPurchases();
        } else {
          alert('Failed to add test payment: ' + result.error);
        }
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    loadPurchases();
  </script>
</body>
</html>
