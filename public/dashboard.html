<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Earnify</title>
  <link rel="stylesheet" href="landing.css">
  <style>
    body { margin: 0; background: #f8fafc; }
    .content-wrapper { padding: 3rem 0; min-height: 80vh; }
    #purchases {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .purchase-card { 
      background: white;
      border: 1px solid #e2e8f0; 
      padding: 20px; 
      margin: 0; 
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s;
      position: relative;
    }
    .purchase-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }
    .purchase-card h3 {
      color: #1e293b;
      margin-bottom: 10px;
    }
    .purchase-card p {
      color: #64748b;
      margin: 8px 0;
    }
    .status { 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      position: absolute;
      top: 15px;
      right: 15px;
    }
    .completed { background: #10b981; color: white; }
    .pending { background: #f59e0b; color: white; }
    .failed { background: #ef4444; color: white; }
    .container h1 {
      color: #1e293b;
      margin-bottom: 30px;
      font-size: 32px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    .empty-state p {
      color: #64748b;
      font-size: 18px;
    }
    .empty-state a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
    }
    .price-tag {
      color: #10b981;
      font-weight: 700;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" style="text-decoration: none; color: inherit;"><h1 class="logo">💰 Earnify</h1></a>
      <div class="nav-links">
        <a href="index.html#resources">Resources</a>
        <a href="index.html#about">About</a>
        <a href="dashboard.html" style="color: #fbbf24;">Dashboard</a>
        
        <div id="userMenu" class="user-menu" style="display:flex;">
          <button class="user-menu-btn" onclick="toggleUserDropdown()">
            <span class="user-avatar">👤</span>
            <span id="userName">User</span>
            <span style="font-size:10px;">▼</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <div class="user-dropdown-header">
              <div class="name" id="userDisplayName">User</div>
              <div class="email" id="userEmail">user@email.com</div>
            </div>
            <a href="admin/resources.html"><span>👤</span> View Profile</a>
            <a onclick="logout()"><span>🚪</span> Logout</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="content-wrapper">
    <div class="container">
      <h1>My Purchases</h1>
      <div id="purchases"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://emnrgsgerfjvndexomro.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtbnJnc2dlcmZqdm5kZXhvbXJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0MjAyMTAsImV4cCI6MjA4Nzk5NjIxMH0.uXr8lipxLbB4D_5JwQkpLzc-HudQw23tOFBfV4C6hqY';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
  </script>
  <script src="landing.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    
    if (!currentUser) {
      alert('Please login first');
      window.location.href = 'index.html';
    }

    let allPurchases = [];

    async function loadPurchases() {
      try {
        const response = await fetch(`http://localhost:5000/api/payments/${currentUser.id}`);
        
        if (!response.ok) {
          document.getElementById('purchases').innerHTML = `
            <div class="empty-state">
              <h2>🛒 No Purchases Yet</h2>
              <p>You haven't made any purchases. <a href="index.html#resources">Browse our resources</a> to get started!</p>
            </div>
          `;
          return;
        }
        
        const purchases = await response.json();
        allPurchases = purchases;
        displayPurchases(purchases);
      } catch (error) {
        document.getElementById('purchases').innerHTML = '<div class="empty-state"><h2>🛒 No Purchases Yet</h2><p>You haven\'t made any purchases. <a href="index.html#resources">Browse our resources</a> to get started!</p></div>';
      }
    }

    function displayPurchases(purchases) {
      const container = document.getElementById('purchases');
      
      if (purchases.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h2>🛒 No Purchases Yet</h2>
            <p>You haven't made any purchases. <a href="index.html#resources">Browse our resources</a> to get started!</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = purchases.map(purchase => `
          <div class="purchase-card">
            <h3>📦 ${purchase.resources?.title || 'Resource'}</h3>
            <p><strong>Type:</strong> ${purchase.resources?.type || 'N/A'}</p>
            <p class="price-tag"><strong>Price:</strong> ₹${purchase.resources?.price || 'N/A'}</p>
            <p><strong>Payment ID:</strong> ${purchase.payment_id}</p>
            <p><strong>Order ID:</strong> ${purchase.order_id || 'N/A'}</p>
            <p><strong>Date:</strong> ${new Date(purchase.created_at).toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
            <span class="status ${purchase.status.toLowerCase()}">${purchase.status.toUpperCase()}</span>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
              <button onclick="downloadReceipt('${purchase.payment_id}', '${purchase.order_id}', '${purchase.resources?.title || 'Resource'}', '${purchase.resources?.price || 0}')" style="flex: 1; background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">🧾 Download Receipt</button>
              ${purchase.resources?.fileurl ? `<a href="${purchase.resources.fileurl}" target="_blank" download style="flex: 1; background: #3b82f6; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600;">📥 Download Content</a>` : '<button disabled style="flex: 1; background: #94a3b8; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: not-allowed; font-weight: 600;">📥 Download Content</button>'}
            </div>
          </div>
        `).join('');
    }

    function logout() {
      localStorage.removeItem('currentUser');
      localStorage.removeItem('userLoggedIn');
      window.location.href = 'index.html';
    }
    
    function downloadReceipt(paymentId, orderId, title, price) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      doc.setFontSize(20);
      doc.setTextColor(139, 92, 246);
      doc.text('EARNIFY', 105, 20, { align: 'center' });
      
      doc.setFontSize(16);
      doc.setTextColor(0, 0, 0);
      doc.text('PAYMENT RECEIPT', 105, 30, { align: 'center' });
      
      doc.setDrawColor(139, 92, 246);
      doc.setLineWidth(0.5);
      doc.line(20, 35, 190, 35);
      
      doc.setFontSize(12);
      doc.setTextColor(60, 60, 60);
      
      let y = 50;
      doc.text('Resource:', 20, y);
      doc.setFont(undefined, 'bold');
      doc.text(title, 70, y);
      
      y += 10;
      doc.setFont(undefined, 'normal');
      doc.text('Price:', 20, y);
      doc.setFont(undefined, 'bold');
      doc.setTextColor(16, 185, 129);
      doc.text('₹' + price, 70, y);
      
      y += 10;
      doc.setFont(undefined, 'normal');
      doc.setTextColor(60, 60, 60);
      doc.text('Payment ID:', 20, y);
      doc.setFont(undefined, 'bold');
      doc.text(paymentId, 70, y);
      
      y += 10;
      doc.setFont(undefined, 'normal');
      doc.text('Order ID:', 20, y);
      doc.setFont(undefined, 'bold');
      doc.text(orderId, 70, y);
      
      y += 10;
      doc.setFont(undefined, 'normal');
      doc.text('Date:', 20, y);
      doc.setFont(undefined, 'bold');
      doc.text(new Date().toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }), 70, y);
      
      y += 10;
      doc.setFont(undefined, 'normal');
      doc.text('Status:', 20, y);
      doc.setFont(undefined, 'bold');
      doc.setTextColor(16, 185, 129);
      doc.text('COMPLETED', 70, y);
      
      doc.setFontSize(10);
      doc.setTextColor(100, 100, 100);
      doc.text('Thank you for your purchase!', 105, 280, { align: 'center' });
      doc.text('www.earnify.com', 105, 285, { align: 'center' });
      
      doc.save(`Receipt_${paymentId}.pdf`);
    }

    loadPurchases();
  </script>
</body>
</html>
